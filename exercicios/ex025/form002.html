<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Teste de formulário</h1>
    <form action="cadastro.php" method="post" autocomplete="on">
        <p><label for="iusu">Usuário: </label></p>
        <input type="text" name="usu" id="iusu" required minlength="5" size="10" placeholder="nome do usuário" autocomplete="username">
        <p><label for="isenha">Senha: </label></p>
        <input type="password" name="senha" id="isenha" required minlength="8" maxlength="15" size="10" placeholder="senha do usuário" autocomplete="current-password">
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
